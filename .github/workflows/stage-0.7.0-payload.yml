name: Stage whmcsmod 0.7.0 payload

on:
  push:
    branches:
      - publish/0.7.0

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/0.7.0

      - name: Download and verify authenticated artifact
        shell: bash
        env:
          ARTIFACT_URL: https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0dfc-8210-aff3-e05d7aee5480/raw?se=2026-09-14T22%3A19%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=41160a2a-c1b8-5eed-bba1-464f9ff37c3a&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A19%3A44Z&ske=2026-09-15T20%3A19%3A44Z&sks=b&skv=2026-02-06&sig=%2BCuzQ02U972yPTfDBaiAh9m1CQbjqQ329yMgunPpEQc%3D
        run: |
          set -euo pipefail
          version='0.7.0'
          expected_sha='644a6cf770c63906f7838dd6bff0601b52321d059370028dea51db80fa3d8511'
          expected_fpr='9A3FFFFD9AA2CDA1B825A9F90425CF942B02684C'
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          curl -fsSL --proto '=https' --tlsv1.2 "$ARTIFACT_URL" -o "$work/distribution.zip"
          unzip -q "$work/distribution.zip" -d "$work/dist"

          artifact="$work/dist/whmcsmod-$version.tar.gz"
          metadata="$work/dist/release.meta"
          signature="$work/dist/release.meta.asc"
          [[ -f "$artifact" && -f "$metadata" && -f "$signature" ]]
          grep -Fx "version=$version" "$metadata" >/dev/null
          grep -Fx "sha256=$expected_sha" "$metadata" >/dev/null
          [[ "$(sha256sum "$artifact" | awk '{print tolower($1)}')" == "$expected_sha" ]]

          ghome="$work/gnupg"; mkdir -m 0700 "$ghome"
          GNUPGHOME="$ghome" gpg --batch --import release-signing-public.asc >/dev/null 2>&1
          fpr="$(GNUPGHOME="$ghome" gpg --batch --with-colons --list-keys 2>/dev/null | awk -F: '$1=="pub"{want=1;next} want&&$1=="fpr"{print toupper($10);exit}')"
          [[ "$fpr" == "$expected_fpr" ]]
          status="$(GNUPGHOME="$ghome" gpg --batch --status-fd=1 --verify "$signature" "$metadata" 2>/dev/null)"
          valid="$(printf '%s\n' "$status" | awk '/^\[GNUPG:\] VALIDSIG /{print toupper($3);exit}')"
          [[ "$valid" == "$expected_fpr" ]]

          expected=$'VERSION\ninstall.sh\nlib/commands.sh\nlib/common.sh\nlib/deploy.sh\nlib/import.sh\nlib/install-detect.sh\nlib/manifest.php\nlib/ops.sh\nlib/release.sh\nlib/repo.sh\nlib/self-update.sh\nwhmcsmod'
          actual="$(tar -tzf "$artifact" | sed 's#^\./##' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          if tar -tvzf "$artifact" | awk '$1 !~ /^-/ {found=1} END {exit found ? 0 : 1}'; then
            echo 'Archive contains a non-regular entry' >&2
            exit 1
          fi

          mkdir -p "releases/$version"
          install -m 0644 "$artifact" "releases/$version/whmcsmod-$version.tar.gz"
          install -m 0644 "$metadata" "releases/$version/release.meta"
          install -m 0644 "$signature" "releases/$version/release.meta.asc"
          install -m 0644 "$metadata" stable.meta
          install -m 0644 "$signature" stable.meta.asc

      - name: Commit payload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'whmcsmod publication bot'
          git config user.email 'whmcsmod-publication@users.noreply.github.com'
          git add stable.meta stable.meta.asc releases/0.7.0
          git diff --cached --check
          git commit -m 'Stage authenticated whmcsmod 0.7.0 payload'
          git push origin HEAD:publish/0.7.0
