name: Assemble whmcsmod 0.6.0 public publication

on:
  push:
    branches:
      - publish/0.6.0

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/0.6.0

      - name: Download, verify and stage authenticated release
        shell: bash
        env:
          ARTIFACT_URL: https://sdmntprnortheu.oaiusercontent.com/files/00000000-82a0-81f4-a1f0-7ba3bd680836/raw?se=2026-09-14T20%3A09%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=380f46c4-9d9e-5259-929c-1d747c05b6d2&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T23%3A11%3A20Z&ske=2026-09-14T23%3A11%3A20Z&sks=b&skv=2026-02-06&sig=ppEvrvunZ%2B0/LS2rDj1yt71y9oyNgBi2sHuFJQyo/eM%3D
        run: |
          set -euo pipefail
          version='0.6.0'
          expected_fpr='9A3FFFFD9AA2CDA1B825A9F90425CF942B02684C'
          expected_sha='a0888c8cd63915c86150ff254be4c5cfdc0380495f7e0d60f1f9eed2db2d56b6'
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT

          curl -fsSL --proto '=https' --tlsv1.2 "$ARTIFACT_URL" -o "$work/distribution.zip"
          unzip -q "$work/distribution.zip" -d "$work/dist"
          [[ -f "$work/dist/whmcsmod-$version.tar.gz" ]]
          [[ -f "$work/dist/release.meta" && -f "$work/dist/release.meta.asc" ]]
          grep -Fx "version=$version" "$work/dist/release.meta" >/dev/null
          grep -Fx "sha256=$expected_sha" "$work/dist/release.meta" >/dev/null
          [[ "$(sha256sum "$work/dist/whmcsmod-$version.tar.gz" | awk '{print $1}')" == "$expected_sha" ]]

          ghome="$work/gnupg"; mkdir -m 0700 "$ghome"
          GNUPGHOME="$ghome" gpg --batch --import release-signing-public.asc >/dev/null 2>&1
          fpr="$(GNUPGHOME="$ghome" gpg --batch --with-colons --list-keys 2>/dev/null | awk -F: '$1=="pub"{want=1;next} want&&$1=="fpr"{print toupper($10);exit}')"
          [[ "$fpr" == "$expected_fpr" ]]
          status="$(GNUPGHOME="$ghome" gpg --batch --status-fd=1 --verify "$work/dist/release.meta.asc" "$work/dist/release.meta" 2>/dev/null)"
          valid="$(printf '%s\n' "$status" | awk '/^\[GNUPG:\] VALIDSIG /{print toupper($3);exit}')"
          [[ "$valid" == "$expected_fpr" ]]

          expected=$'VERSION\ninstall.sh\nlib/commands.sh\nlib/common.sh\nlib/deploy.sh\nlib/install-detect.sh\nlib/manifest.php\nlib/ops.sh\nlib/release.sh\nlib/repo.sh\nlib/self-update.sh\nwhmcsmod'
          actual="$(tar -tzf "$work/dist/whmcsmod-$version.tar.gz" | sed 's#^\./##' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          if tar -tvzf "$work/dist/whmcsmod-$version.tar.gz" | awk '$1 !~ /^-/ {found=1} END {exit found ? 0 : 1}'; then
            echo 'Archive contains a non-regular entry' >&2
            exit 1
          fi

          mkdir -p "releases/$version"
          install -m 0644 "$work/dist/whmcsmod-$version.tar.gz" "releases/$version/whmcsmod-$version.tar.gz"
          install -m 0644 "$work/dist/release.meta" "releases/$version/release.meta"
          install -m 0644 "$work/dist/release.meta.asc" "releases/$version/release.meta.asc"
          install -m 0644 "$work/dist/release.meta" stable.meta
          install -m 0644 "$work/dist/release.meta.asc" stable.meta.asc

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-distribution.yml')
          s = p.read_text()
          needle = """            0.5.0)\n              expected=$'VERSION\\ninstall.sh\\nlib/commands.sh\\nlib/common.sh\\nlib/deploy.sh\\nlib/install-detect.sh\\nlib/manifest.php\\nlib/ops.sh\\nlib/release.sh\\nlib/repo.sh\\nlib/self-update.sh\\nwhmcsmod'\n              ;;\n"""
          add = needle + """            0.6.0)\n              expected=$'VERSION\\ninstall.sh\\nlib/commands.sh\\nlib/common.sh\\nlib/deploy.sh\\nlib/install-detect.sh\\nlib/manifest.php\\nlib/ops.sh\\nlib/release.sh\\nlib/repo.sh\\nlib/self-update.sh\\nwhmcsmod'\n              ;;\n"""
          if needle not in s or '            0.6.0)' in s:
              raise SystemExit('verifier insertion point mismatch')
          p.write_text(s.replace(needle, add, 1))

          p = Path('.github/workflows/end-to-end-install.yml')
          s = p.read_text()
          replacements = {
              "== '0.5.0'": "== '0.6.0'",
              "Current: 0.5.0": "Current: 0.6.0",
              "Latest:  0.5.0": "Latest:  0.6.0",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'E2E marker missing: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

          rm -rf .publish-tmp
          rm -f .github/workflows/assemble-0.6.0-publication.yml

      - name: Commit final publication tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'whmcsmod publication bot'
          git config user.email 'whmcsmod-publication@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish authenticated whmcsmod 0.6.0 distribution'
          git push origin HEAD:publish/0.6.0
