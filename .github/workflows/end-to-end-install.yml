name: End-to-end bootstrap install

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare fake WHMCS root
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /tmp/whmcsmod-e2e-whmcs
          printf '%s\n' '<?php // bootstrap e2e fixture' | sudo tee /tmp/whmcsmod-e2e-whmcs/init.php >/dev/null
          sudo chown nobody:nogroup /tmp/whmcsmod-e2e-whmcs/init.php
          sudo chmod 0644 /tmp/whmcsmod-e2e-whmcs/init.php

      - name: Run exact publication bootstrap
        shell: bash
        env:
          DIST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          distribution_base="https://raw.githubusercontent.com/faridze/whmcsmod-bootstrap/$DIST_REF"
          curl -fsSL "$distribution_base/install.sh" \
            | sudo env WHMCSMOD_DISTRIBUTION_BASE_URL="$distribution_base" bash -s -- \
                --target e2e \
                --whmcs-root /tmp/whmcsmod-e2e-whmcs

      - name: Verify installed manager and self-update
        shell: bash
        run: |
          set -euo pipefail
          [[ -x /usr/local/sbin/whmcsmod ]]
          [[ -f /usr/local/lib/whmcsmod/VERSION ]]
          [[ "$(tr -d '[:space:]' < /usr/local/lib/whmcsmod/VERSION)" == '0.7.1' ]]
          [[ -f /usr/local/lib/whmcsmod/self-update.sh ]]
          [[ -f /usr/local/lib/whmcsmod/ops.sh ]]
          [[ -f /usr/local/lib/whmcsmod/import.sh ]]
          [[ -f /etc/whmcsmod/keys/release-signing-public.asc ]]
          sudo grep -Fx 'TRUSTED_TAG_SIGNING_FINGERPRINT=9A3FFFFD9AA2CDA1B825A9F90425CF942B02684C' /etc/whmcsmod/config.conf >/dev/null
          sudo grep -Fx 'DEFAULT_TARGET=e2e' /etc/whmcsmod/config.conf >/dev/null
          sudo grep -F 'WHMCS_ROOT=/tmp/whmcsmod-e2e-whmcs' /etc/whmcsmod/targets/e2e.conf >/dev/null
          sudo grep -F 'WHMCS_RUN_USER=nobody' /etc/whmcsmod/targets/e2e.conf >/dev/null
          sudo /usr/local/sbin/whmcsmod doctor
          sudo /usr/local/sbin/whmcsmod target list
          sudo /usr/local/sbin/whmcsmod --help | grep -F 'import scan <module>' >/dev/null

          # self-update intentionally reads the mutable public-main stable pointer.
          # Immediately after a publication, raw.githubusercontent.com may briefly
          # serve the previously authenticated stable metadata from CDN cache. The
          # immutable DIST_REF bootstrap above already validates the exact commit
          # under test, so here we validate that self-update authenticates and
          # reports semantically correct status for whichever signed stable version
          # public main is currently serving, without treating safe cache lag as a
          # release failure.
          : > /tmp/whmcsmod-self-update-check.out
          ok=0
          for attempt in 1 2 3; do
            if sudo /usr/local/sbin/whmcsmod self-update --check > /tmp/whmcsmod-self-update-check.out 2>&1; then
              ok=1
              break
            fi
            cat /tmp/whmcsmod-self-update-check.out >&2
            (( attempt < 3 )) && sleep 2
          done
          [[ "$ok" -eq 1 ]]
          cat /tmp/whmcsmod-self-update-check.out

          current="$(awk '/^Current: / {print $2; exit}' /tmp/whmcsmod-self-update-check.out)"
          latest="$(awk '/^Latest: / {print $2; exit}' /tmp/whmcsmod-self-update-check.out)"
          [[ "$current" == '0.7.1' ]]
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ "$current" == "$latest" ]]; then
            grep -F 'whmcsmod is already up to date.' /tmp/whmcsmod-self-update-check.out >/dev/null
          elif dpkg --compare-versions "$current" gt "$latest"; then
            grep -F 'Installed manager is newer than the published stable release.' /tmp/whmcsmod-self-update-check.out >/dev/null
          else
            grep -F "Update available: $current -> $latest" /tmp/whmcsmod-self-update-check.out >/dev/null
          fi
