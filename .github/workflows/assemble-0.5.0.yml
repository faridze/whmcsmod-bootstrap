name: Assemble whmcsmod 0.5.0 artifact

on:
  push:
    branches:
      - publish/0.5.0
    paths:
      - '.github/workflows/assemble-0.5.0.yml'
      - '.publish-tmp/0.5.0/**'

permissions:
  contents: write

concurrency:
  group: assemble-whmcsmod-0.5.0
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/0.5.0
          fetch-depth: 0

      - name: Assemble and verify authenticated artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/0.5.0
          cat .publish-tmp/0.5.0/part00 .publish-tmp/0.5.0/part01 .publish-tmp/0.5.0/part02 .publish-tmp/0.5.0/part03 .publish-tmp/0.5.0/part04 \
            | base64 -d > releases/0.5.0/whmcsmod-0.5.0.tar.gz

          expected_sha='16a633dc040a79f0abdc3c085638bc6d58e7c570d5ddd1781a238c912d1143c4'
          actual_sha="$(sha256sum releases/0.5.0/whmcsmod-0.5.0.tar.gz | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]]
          grep -Fx "version=0.5.0" releases/0.5.0/release.meta >/dev/null
          grep -Fx "sha256=$expected_sha" releases/0.5.0/release.meta >/dev/null
          cmp -s stable.meta releases/0.5.0/release.meta
          cmp -s stable.meta.asc releases/0.5.0/release.meta.asc

          expected_layout=$'VERSION\ninstall.sh\nlib/commands.sh\nlib/common.sh\nlib/deploy.sh\nlib/install-detect.sh\nlib/manifest.php\nlib/ops.sh\nlib/release.sh\nlib/repo.sh\nlib/self-update.sh\nwhmcsmod'
          actual_layout="$(tar -tzf releases/0.5.0/whmcsmod-0.5.0.tar.gz | sed 's#^\./##' | LC_ALL=C sort)"
          [[ "$actual_layout" == "$expected_layout" ]]
          if tar -tvzf releases/0.5.0/whmcsmod-0.5.0.tar.gz | awk '$1 !~ /^-/ {bad=1} END {exit bad ? 0 : 1}'; then
            echo 'Non-regular archive member found' >&2
            exit 1
          fi

          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --import release-signing-public.asc >/dev/null 2>&1
          fingerprint="$(gpg --batch --with-colons --list-keys | awk -F: '$1=="pub"{want=1;next} want&&$1=="fpr"{print toupper($10);exit}')"
          [[ "$fingerprint" == '9A3FFFFD9AA2CDA1B825A9F90425CF942B02684C' ]]
          status="$(gpg --batch --status-fd=1 --verify releases/0.5.0/release.meta.asc releases/0.5.0/release.meta 2>/dev/null)"
          actual_fpr="$(printf '%s\n' "$status" | awk '/^\[GNUPG:\] VALIDSIG /{print toupper($3);exit}')"
          [[ "$actual_fpr" == "$fingerprint" ]]
          status="$(gpg --batch --status-fd=1 --verify stable.meta.asc stable.meta 2>/dev/null)"
          actual_fpr="$(printf '%s\n' "$status" | awk '/^\[GNUPG:\] VALIDSIG /{print toupper($3);exit}')"
          [[ "$actual_fpr" == "$fingerprint" ]]

      - name: Commit final artifact and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'whmcsmod publication bot'
          git config user.email 'whmcsmod-publication@users.noreply.github.com'
          git rm -r .publish-tmp/0.5.0 .github/workflows/assemble-0.5.0.yml
          git add releases/0.5.0/whmcsmod-0.5.0.tar.gz
          git commit -m 'Add authenticated whmcsmod 0.5.0 artifact'
          git push origin HEAD:publish/0.5.0
